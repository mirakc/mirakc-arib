services:
  megalinter:
    image: ghcr.io/oxsecurity/megalinter-c_cpp:v10.1.0@sha256:6828af1074f28053d81285c4bfbf6e6cff0986b4802cf10b002955767ace1ccc # editorconfig-checker-disable-line
    # Every variable below can be overridden from the host environment except
    # DEFAULT_WORKSPACE, which must match the volume mount path below.
    environment:
      - APPLY_FIXES
      - ENABLE_LINTERS
      - LOG_LEVEL
      - CLEAR_REPORT_FOLDER=${CLEAR_REPORT_FOLDER:-true}
      - DEFAULT_WORKSPACE=/tmp/lint
    volumes:
      - .:/tmp/lint
