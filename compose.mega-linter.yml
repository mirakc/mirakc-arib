services:
  megalinter:
    image: ghcr.io/oxsecurity/megalinter-c_cpp:v10.0.0@sha256:75fd2753d62533c26d903a23d679dcec01036eaebb3fc3313d36766ee040396c # editorconfig-checker-disable-line
    # Every variable below can be overridden from the host environment except
    # DEFAULT_WORKSPACE, which must match the volume mount path below.
    environment:
      - APPLY_FIXES
      - ENABLE_LINTERS
      - LOG_LEVEL
      - CLEAR_REPORT_FOLDER=${CLEAR_REPORT_FOLDER:-true}
      - DEFAULT_WORKSPACE=/tmp/lint
    volumes:
      - .:/tmp/lint
