services:
  megalinter:
    image: ghcr.io/oxsecurity/megalinter-c_cpp:v10.2.0@sha256:39bfa037cd6e7949f7a27650c503cee7479dd7d85aee80c11211c5eb2fbc6709 # editorconfig-checker-disable-line
    # Every variable below can be overridden from the host environment except
    # DEFAULT_WORKSPACE, which must match the volume mount path below.
    environment:
      - APPLY_FIXES
      - ENABLE_LINTERS
      - LOG_LEVEL
      - CLEAR_REPORT_FOLDER=${CLEAR_REPORT_FOLDER:-true}
      - DEFAULT_WORKSPACE=/tmp/lint
    volumes:
      - .:/tmp/lint
